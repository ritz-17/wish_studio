name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs this via deploy.yml
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build
