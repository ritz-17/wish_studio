# Production stack for a single server. Values come from the .env file next to this file
# (see deploy/server.env.example). Only Caddy is reachable from the internet.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wishstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wishstudio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishstudio -d wishstudio"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}/wish-studio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wishstudio:${POSTGRES_PASSWORD}@postgres:5432/wishstudio?schema=public
      WEB_ORIGINS: ${WEB_ORIGINS:?set WEB_ORIGINS in .env}
      API_PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX}/wish-studio-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
