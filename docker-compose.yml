services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wishstudio
      POSTGRES_PASSWORD: wishstudio
      POSTGRES_DB: wishstudio
    ports:
      - "5432:5432"
    volumes:
      - wishstudio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishstudio -d wishstudio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wishstudio-postgres: